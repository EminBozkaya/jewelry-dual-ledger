services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: kuyumcu_private_db
    environment:
      POSTGRES_DB: kuyumcu_private
      POSTGRES_USER: kuyumcu
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuyumcu -d kuyumcu_private"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/eminbozkaya/jewelery-dual-ledger:test
    container_name: kuyumcu_private_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=kuyumcu_private;Username=kuyumcu;Password=${DB_PASSWORD:-changeme}
      - Jwt__Key=${JWT_SECRET_KEY}
      - Jwt__Issuer=kuyumcu-private
      - Jwt__Audience=kuyumcu-private-client
      - Jwt__ExpiryHours=12
      - Evds__ApiKey=lku649r7Oj
      - Cors__Origins__0=http://localhost:3000
      - Cors__Origins__1=https://test-kuyumcu-private.pages.dev
      - Cors__Origins__2=https://test-kuyumcu.defteri.app
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
